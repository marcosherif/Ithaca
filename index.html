<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ithaca Camp 2026 — Live Race Board</title>
<style>
  :root{ --bg:#0e1726; --panel:#16223a; --ink:#eaf0fb; --muted:#9fb2d0; }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,Arial,sans-serif}
  html,body{background:var(--bg);color:var(--ink);height:100%}
  body{min-height:100vh}

  /* LAYOUT: side-by-side on desktop, stacked on mobile */
  .wrap{display:grid;grid-template-columns:1fr 340px;min-height:100vh}
  @media (max-width:900px){
    .wrap{grid-template-columns:1fr}   /* stack */
  }

  /* MAP ZONE */
  .mapzone{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
  /* The board keeps the TRUE aspect ratio of the map (1024x574) so it can NEVER distort */
  #board{position:relative;width:100%;max-width:1024px;aspect-ratio:1024/574}
  #board img{width:100%;height:100%;display:block;object-fit:contain;border-radius:10px;
    box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .title{width:100%;max-width:1024px;margin:0 auto 10px;padding:0 4px;z-index:8}
  .title h1{font-size:clamp(14px,1.6vw,22px)}
  .title p{font-size:clamp(9px,1vw,12px);color:var(--muted)}

  /* markers positioned by PERCENT of #board -> always aligned */
  .marker{position:absolute;width:clamp(22px,2.6vw,34px);height:clamp(22px,2.6vw,34px);
    transform:translate(-50%,-50%);border-radius:50%;border:3px solid #fff;
    display:flex;align-items:center;justify-content:center;font-size:clamp(11px,1.3vw,16px);
    font-weight:800;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.55);
    transition:left 1.6s cubic-bezier(.4,.1,.2,1),top 1.6s cubic-bezier(.4,.1,.2,1);z-index:5}
  .marker img{width:66%;height:66%;object-fit:contain;display:block;pointer-events:none}
  .marker.win{animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.25)}}
  .flag{position:absolute;width:clamp(10px,1.2vw,16px);height:clamp(10px,1.2vw,16px);
    transform:translate(-50%,-50%);border-radius:3px;border:2px solid #fff;opacity:.85;z-index:4}

  /* SIDEBAR */
  .side{background:var(--panel);padding:18px 16px;border-left:2px solid #223353}
  @media (max-width:900px){ .side{border-left:none;border-top:2px solid #223353} }
  .side h2{font-size:15px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:12px}
  .team{margin-bottom:14px;background:#0f1a2e;border-radius:12px;padding:12px 13px;border-left:5px solid #555;position:relative}
  .team .row1{display:flex;justify-content:space-between;align-items:baseline}
  .team .name{font-size:16px;font-weight:700}
  .team .miles{font-size:20px;font-weight:800}
  .team .miles span{font-size:11px;color:var(--muted);font-weight:500}
  .bar{height:12px;border-radius:8px;background:#1c2b47;margin-top:9px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;border-radius:8px;transition:width 1.4s ease}
  .rank{position:absolute;top:10px;right:12px;font-size:11px;color:var(--muted)}
  .foot{margin-top:8px;font-size:11px;color:var(--muted);text-align:center}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
  .pts{font-size:11px;color:var(--muted)}
  .status{font-size:11px;color:var(--muted);text-align:center;margin-top:6px;cursor:pointer}
  .win-badge{display:inline-block;background:gold;color:#000;font-size:10px;font-weight:800;
    padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:middle}
</style>
</head>

function pointAt(path,t){
  t=Math.max(0,Math.min(1,t));
  let segs=[],total=0;
  for(let i=0;i<path.length-1;i++){
    const dx=path[i+1][0]-path[i][0], dy=path[i+1][1]-path[i][1];
    const L=Math.hypot(dx,dy); segs.push(L); total+=L;
  }
  let target=t*total, acc=0;
  for(let i=0;i<segs.length;i++){
    if(acc+segs[i]>=target){
      const f=segs[i]?(target-acc)/segs[i]:0;
      return [path[i][0]+(path[i+1][0]-path[i][0])*f,
              path[i][1]+(path[i+1][1]-path[i][1])*f];
    }
    acc+=segs[i];
  }
  return path[path.length-1];
}
function parseCSV(text){
  const rows=[]; let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){cur+='"';i++;} else q=false;} else cur+=c; }
    else{ if(c=='"')q=true; else if(c==','){row.push(cur);cur="";}
      else if(c=='\n'){row.push(cur);rows.push(row);row=[];cur="";}
      else if(c=='\r'){} else cur+=c; }
  }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function extractData(rows){
  if(!rows.length) return {};
  const header=rows[0].map(h=>h.toString().trim().toLowerCase());
  const idx=(names)=>header.findIndex(h=>names.some(n=>h.includes(n)));
  const iTeam=idx(["team","army"]), iMiles=idx(["mile"]), iPct=idx(["percent","%"]);
  const iPts=idx(["total_points","total points","points","score"]), iTarget=idx(["target"]);
  const out={};
  const names=Object.keys(TEAMS).map(t=>t.toLowerCase());
  for(let r=1;r<rows.length;r++){
    const cells=rows[r]; if(!cells) continue;
    let team=iTeam>=0?(cells[iTeam]||"").trim():"";
    if(!team){ for(const c of cells){const v=(c||"").trim().toLowerCase();
      const m=names.find(t=>t===v); if(m){team=m;break;}} }
    const canon=Object.keys(TEAMS).find(t=>t.toLowerCase()===team.toLowerCase());
    if(!canon) continue;
    const num=v=>{const n=parseFloat((v||"").toString().replace(/[^0-9.\-]/g,""));return isNaN(n)?null:n;};
    let miles=null,pts=null;
    if(iMiles>=0) miles=num(cells[iMiles]);
    if(miles===null && iPct>=0){const p=num(cells[iPct]); if(p!==null) miles=(p<=1?p*100:p);}
    if(iPts>=0) pts=num(cells[iPts]);
    const tgt=(iTarget>=0?num(cells[iTarget]):null)||TARGET;
    if(miles===null && pts!==null) miles=Math.min(pts/tgt,1)*100;
    if(miles===null) miles=0;
    miles=Math.max(0,Math.min(100,miles));
    if(pts===null) pts=Math.round(miles/100*tgt);
    out[canon]={miles,pts,target:tgt};
  }
  return out;
}

let markerEls={},flagEls={};
function buildStatic(){
  const board=document.getElementById("board");
  for(const [name,cfg] of Object.entries(TEAMS)){
    const f=document.createElement("div");
    f.className="flag"; f.style.background=cfg.color;
    f.style.left=(cfg.end[0]/NAT_W*100)+"%"; f.style.top=(cfg.end[1]/NAT_H*100)+"%";
    board.appendChild(f); flagEls[name]=f;
    const m=document.createElement("div");
    m.className="marker"; m.style.background=cfg.color; m.style.color=cfg.ink;
    m.innerHTML="<img src=\""+ICON[name]+"\" alt=\""+name+"\">"; m.title=name; board.appendChild(m); markerEls[name]=m;
  }
}
let lastData={};
function render(data){
  lastData=data||{};
  for(const [name,cfg] of Object.entries(TEAMS)){
    const d=lastData[name]||{miles:0};
    const p=pointAt(cfg.path,d.miles/100);
    const m=markerEls[name];
    m.style.left=(p[0]/NAT_W*100)+"%";
    m.style.top=(p[1]/NAT_H*100)+"%";
    m.classList.toggle("win",d.miles>=100);
  }
  const arr=Object.entries(TEAMS).map(([name,cfg])=>({name,cfg,...(lastData[name]||{miles:0,pts:0})}));
  arr.sort((a,b)=>b.miles-a.miles);
  const lb=document.getElementById("leaderboard"); lb.innerHTML="";
  arr.forEach((t,i)=>{
    const win=t.miles>=100;
    const el=document.createElement("div");
    el.className="team"; el.style.borderLeftColor=t.cfg.color;
    el.innerHTML=`<div class="rank">#${i+1}</div>
      <div class="row1"><div class="name"><span class="dot" style="background:${t.cfg.color}"></span>${t.name}
        ${win?'<span class="win-badge">🏆 HOME</span>':''}</div>
        <div class="miles">${t.miles.toFixed(1)}<span> mi</span></div></div>
      <div class="bar"><i style="width:${t.miles}%;background:${t.cfg.color}"></i></div>
      <div class="pts">${t.pts} / ${t.target||TARGET} pts</div>`;
    lb.appendChild(el);
  });
}
async function load(){
  const st=document.getElementById("status");
  try{
    const res=await fetch(CSV_URL+"&_cb="+Date.now());
    const txt=await res.text();
    render(extractData(parseCSV(txt)));
    st.textContent="Updated "+new Date().toLocaleTimeString();
  }catch(e){
    st.textContent="⚠ Could not load — tap to retry";
    console.error(e);
  }
}
buildStatic();
render({});
load();
setInterval(load,REFRESH_MS);
</script>
