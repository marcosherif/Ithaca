<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1726">
<title>Ithaca Camp 2026 — Live Race Board</title>
<style>
  :root{
    --viking:#f2c200; --spartan:#1f4e9c; --samurai:#b5121b; --mongol:#2e8b2e;
    --bg:#0e1726; --panel:#16223a; --ink:#eaf0fb; --muted:#9fb2d0;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);overflow:hidden}

  /* ===== Desktop / landscape: map + sidebar ===== */
  .wrap{display:grid;grid-template-columns:1fr clamp(280px,26vw,360px);
    height:100vh;height:100dvh;gap:0}

  .mapzone{position:relative;background:#0e1726;display:flex;align-items:center;
    justify-content:center;padding:10px;min-width:0}
  .mapinner{position:relative;line-height:0;width:100%;
    max-width:min(100%,calc((100vh - 20px) * 1.6301))}
  .mapinner img{width:100%;height:auto;display:block;border-radius:10px;
    box-shadow:0 8px 30px rgba(0,0,0,.5)}

  .marker{position:absolute;width:clamp(22px,3.4vw,34px);height:clamp(22px,3.4vw,34px);
    border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;
    font-size:clamp(11px,1.6vw,16px);font-weight:800;color:#fff;
    box-shadow:0 3px 10px rgba(0,0,0,.55);transform:translate(-50%,-50%);
    transition:left 1.6s cubic-bezier(.4,.1,.2,1),top 1.6s cubic-bezier(.4,.1,.2,1);z-index:5}
  .marker.win{animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}
    50%{transform:translate(-50%,-50%) scale(1.28)}}
  .flag{position:absolute;width:clamp(11px,1.6vw,16px);height:clamp(11px,1.6vw,16px);
    border-radius:3px;border:2px solid #fff;opacity:.85;transform:translate(-50%,-50%);z-index:4}

  .title{position:absolute;top:12px;left:16px;z-index:8;pointer-events:none}
  .title h1{font-size:clamp(13px,1.9vw,22px);letter-spacing:.5px}
  .title p{font-size:clamp(9px,1.1vw,12px);color:var(--muted)}

  .side{background:var(--panel);padding:16px 14px;overflow-y:auto;
    border-left:2px solid #223353;-webkit-overflow-scrolling:touch}
  .side h2{font-size:14px;text-transform:uppercase;letter-spacing:1.4px;
    color:var(--muted);margin-bottom:12px}

  .team{margin-bottom:14px;background:#0f1a2e;border-radius:12px;padding:11px 12px;
    border-left:5px solid #555;position:relative}
  .team .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .team .name{font-size:15px;font-weight:700}
  .team .miles{font-size:19px;font-weight:800;white-space:nowrap}
  .team .miles span{font-size:11px;color:var(--muted);font-weight:500}
  .bar{height:12px;border-radius:8px;background:#1c2b47;margin-top:8px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;border-radius:8px;transition:width 1.4s ease}
  .rank{position:absolute;top:9px;right:11px;font-size:11px;color:var(--muted)}
  .pts{font-size:11px;color:var(--muted);margin-top:5px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
  .win-badge{display:inline-block;background:gold;color:#000;font-size:10px;font-weight:800;
    padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:middle}
  .status{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
  .foot{margin-top:6px;font-size:10px;color:var(--muted);text-align:center;
    padding-bottom:env(safe-area-inset-bottom)}

  /* ===== MOBILE / PORTRAIT: stack map on top, board below ===== */
  @media (max-width:820px), (orientation:portrait){
    body{overflow:auto;-webkit-overflow-scrolling:touch}
    .wrap{display:flex;flex-direction:column;height:auto;min-height:100dvh}
    .mapzone{padding:8px;padding-top:calc(8px + env(safe-area-inset-top));
      position:sticky;top:0;z-index:10;
      box-shadow:0 4px 16px rgba(0,0,0,.4);background:var(--bg)}
    .mapinner{max-width:100%}
    .side{border-left:none;border-top:2px solid #223353;padding:14px 12px 22px}
    .title{position:static;text-align:center;margin-bottom:6px}
    .title h1{font-size:16px}
    .title p{font-size:11px}
    /* two-column card grid on wider phones/tablets */
    #board{display:grid;grid-template-columns:1fr;gap:0}
  }
  @media (max-width:820px) and (min-width:520px){
    #board{grid-template-columns:1fr 1fr;gap:10px}
    .team{margin-bottom:0}
  }
  /* larger touch text on small phones */
  @media (max-width:420px){
    .title h1{font-size:14px}
    .team .name{font-size:16px}
    .team .miles{font-size:20px}
  }

  /* Tiny landscape phones: keep side panel but scrollable */
  @media (max-height:430px) and (orientation:landscape){
    .title h1{font-size:13px}.title p{display:none}
  }
</style>
</head>

  <div class="side">
    <h2>🏁 Leaderboard</h2>
    <div id="board"></div>
    <div class="status" id="status">Loading…</div>
    <div class="foot">Auto-refresh every 30s · tap to refresh now</div>
  </div>

<script>
/* ===================== CONFIG ===================== */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR269h_89cns10PdEEqY7XsQoRm0RDfPJd4OkM6ASmU8bwxA5B3xlp218GERKH3qJOKdUUIje-r3B30/pub?gid=1404819249&single=true&output=csv";
const TARGET  = 1000;
const REFRESH_MS = 30000;

const NAT_W = 864, NAT_H = 530;
const TEAMS = {
  "Vikings":  {color:"#f2c200", ink:"#3a2e00", end:[185,130],
    path:[[258,418],[215,470],[110,432],[60,300],[70,190],[120,150],[185,130]]},
  "Spartans": {color:"#1f4e9c", ink:"#fff", end:[138,224],
    path:[[258,418],[251,360],[250,300],[240,255],[160,230],[138,224]]},
  "Mongols":  {color:"#2e8b2e", ink:"#fff", end:[438,213],
    path:[[258,418],[330,395],[410,352],[436,282],[438,213]]},
  "Samurai":  {color:"#b5121b", ink:"#fff", end:[562,240],
    path:[[258,418],[400,432],[560,416],[616,340],[585,270],[562,240]]}
};
const EMOJI={Vikings:"⚔️",Spartans:"🛡️",Mongols:"🏹",Samurai:"🗾"};

function pointAt(path,t){
  t=Math.max(0,Math.min(1,t));
  let segs=[],total=0;
  for(let i=0;i<path.length-1;i++){
    const dx=path[i+1][0]-path[i][0], dy=path[i+1][1]-path[i][1];
    const L=Math.hypot(dx,dy); segs.push(L); total+=L;
  }
  let target=t*total, acc=0;
  for(let i=0;i<segs.length;i++){
    if(acc+segs[i]>=target){
      const f=(target-acc)/segs[i];
      return [path[i][0]+(path[i+1][0]-path[i][0])*f,
              path[i][1]+(path[i+1][1]-path[i][1])*f];
    }
    acc+=segs[i];
  }
  return path[path.length-1];
}
function parseCSV(text){
  const rows=[]; let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){cur+='"';i++;} else q=false;} else cur+=c; }
    else{ if(c=='"')q=true; else if(c==','){row.push(cur);cur="";}
      else if(c=='\n'){row.push(cur);rows.push(row);row=[];cur="";}
      else if(c=='\r'){} else cur+=c; }
  }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function extractData(rows){
  if(!rows.length) return {};
  const header=rows[0].map(h=>h.toString().trim().toLowerCase());
  const idx=(names)=>header.findIndex(h=>names.some(n=>h.includes(n)));
  const iTeam  = idx(["team","army","جيش"]);
  const iMiles = idx(["mile"]);
  const iPct   = idx(["percent","%"]);
  const iPts   = idx(["total_points","total points","points","score","نقاط"]);
  const iTarget= idx(["target"]);
  const out={};
  const teamNames=Object.keys(TEAMS).map(t=>t.toLowerCase());
  for(let r=1;r<rows.length;r++){
    const cells=rows[r]; if(!cells) continue;
    let team=null;
    if(iTeam>=0){ team=(cells[iTeam]||"").trim(); }
    if(!team){
      for(const c of cells){const v=(c||"").trim().toLowerCase();
        const m=teamNames.find(t=>v===t); if(m){team=m;break;}}
    }
    if(!team) continue;
    const canon=Object.keys(TEAMS).find(t=>t.toLowerCase()===team.toLowerCase());
    if(!canon) continue;
    const num=(v)=>{const n=parseFloat((v||"").toString().replace(/[^0-9.\-]/g,""));return isNaN(n)?null:n;};
    let miles=null,pts=null;
    if(iMiles>=0) miles=num(cells[iMiles]);
    if(miles===null && iPct>=0){const p=num(cells[iPct]); if(p!==null) miles=(p<=1?p*100:p);}
    if(iPts>=0) pts=num(cells[iPts]);
    const tgt=(iTarget>=0?num(cells[iTarget]):null)||TARGET;
    if(miles===null && pts!==null) miles=Math.min(pts/tgt,1)*100;
    if(miles===null) miles=0;
    miles=Math.max(0,Math.min(100,miles));
    if(pts===null) pts=Math.round(miles/100*tgt);
    out[canon]={miles,pts,target:tgt};
  }
  return out;
}

let markerEls={},flagEls={};
function buildStatic(){
  const inner=document.getElementById("mapinner");
  for(const [name,cfg] of Object.entries(TEAMS)){
    const f=document.createElement("div");
    f.className="flag"; f.style.background=cfg.color; inner.appendChild(f); flagEls[name]=f;
    const m=document.createElement("div");
    m.className="marker"; m.style.background=cfg.color; m.style.color=cfg.ink;
    m.textContent=EMOJI[name]; m.title=name; inner.appendChild(m); markerEls[name]=m;
  }
  placeStatic();
  const reflow=()=>{placeStatic();render(lastData);};
  window.addEventListener("resize",reflow);
  window.addEventListener("orientationchange",()=>setTimeout(reflow,300));
  document.getElementById("mapimg").addEventListener("load",reflow);
}
function scale(){
  const img=document.getElementById("mapimg");
  return {sx:img.clientWidth/NAT_W, sy:img.clientHeight/NAT_H};
}
function placeStatic(){
  const {sx,sy}=scale();
  for(const [name,cfg] of Object.entries(TEAMS)){
    const f=flagEls[name];
    f.style.left=(cfg.end[0]*sx)+"px"; f.style.top=(cfg.end[1]*sy)+"px";
  }
}
let lastData={};
function render(data){
  lastData=data||{};
  const {sx,sy}=scale();
  for(const [name,cfg] of Object.entries(TEAMS)){
    const d=lastData[name]||{miles:0};
    const p=pointAt(cfg.path,d.miles/100);
    const m=markerEls[name];
    m.style.left=(p[0]*sx)+"px"; m.style.top=(p[1]*sy)+"px";
    m.classList.toggle("win",d.miles>=100);
  }
  const arr=Object.entries(TEAMS).map(([name,cfg])=>({name,cfg,...(lastData[name]||{miles:0,pts:0})}));
  arr.sort((a,b)=>b.miles-a.miles);
  const board=document.getElementById("board");
  board.innerHTML="";
  arr.forEach((t,i)=>{
    const win=t.miles>=100;
    const el=document.createElement("div");
    el.className="team"; el.style.borderLeftColor=t.cfg.color;
    el.innerHTML=`
      <div class="rank">#${i+1}</div>
      <div class="row1">
        <div class="name"><span class="dot" style="background:${t.cfg.color}"></span>${t.name}
          ${win?'<span class="win-badge">🏆 HOME</span>':''}</div>
        <div class="miles">${t.miles.toFixed(1)}<span> mi</span></div>
      </div>
      <div class="bar"><i style="width:${t.miles}%;background:${t.cfg.color}"></i></div>
      <div class="pts">${t.pts} / ${t.target||TARGET} pts</div>`;
    board.appendChild(el);
  });
}
async function load(){
  const st=document.getElementById("status");
  try{
    const res=await fetch(CSV_URL+"&_cb="+Date.now());
    const txt=await res.text();
    render(extractData(parseCSV(txt)));
    st.textContent="Updated "+new Date().toLocaleTimeString();
  }catch(e){
    st.textContent="⚠ Could not load CSV — check link / internet.";
    console.error(e);
  }
}
buildStatic();
load();
setInterval(load,REFRESH_MS);
/* tap anywhere on the board to force refresh (mobile-friendly) */
document.querySelector(".side").addEventListener("click",load);
</script>
